{% extends 'base.html' %}

{% block title %} Booking {% endblock %}

{% block content %}
<style>
    form p label {
        display: block;
        text-align: left;
    }

    form p input,select {
        width: 100%;
    }
</style> 

<h1 class="text-center my-3"> MAKE AN APPOINTMENT </h1>
<hr>
<div class="container text-center w-50 bg-dark-subtle my-5 p-5 overflow-auto">

        <form method="post"> 
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">SAVE</button>
        </form>
    
</div>

{% endblock %}

{% comment %} <div class="container d-flex justify-content-center  mt-5">
    <div style="width: 30rem;">
        
        <form method="post" >
            {% csrf_token %}

            {{ form.as_p }}

       
                <button type="submit" class="btn btn-primary">Save</button>
     
        </form>

    </div>
</div> {% endcomment %}
