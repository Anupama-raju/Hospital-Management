{% load static %}
<html>
    <head>
        <title>{% block title %} {% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link href=".net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body class="bg-success p-2 text-dark bg-opacity-25">
        <div class="topnav">
            <a class="active" href="{% url 'home' %}">HOME</a>
            <a href="{% url 'about' %}">ABOUT</a>
            <a href="{% url 'doctors' %}">DOCTORS</a>
            <a href="{% url 'dept' %}">DEPARTMENT</a>
            <a href="{% url 'booking' %}">BOOKING</a>
            <a href="{% url 'contact' %}">CONTACT</a>
            {% comment %} <a style="float: right;" href="{% url 'login' %}">LOGOUT</a> {% endcomment %}
        </div>

        {% block content %}
        {% endblock %}
    </body>
</html>
