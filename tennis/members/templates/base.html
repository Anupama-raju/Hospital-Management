{% load static %}
<html>
    <head>
        <title>{% block title %} {% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/style.css' %}"> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="{% static 'js/validations.js' %}"></script>
    </head>
    <body class="bg-info-subtle p-2 text-dark bg-opacity-25">
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #008080">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}" style="color: white;">HOME</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav" style="color: white;">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'about' %}" style="color: white;">ABOUT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'doctors' %}" style="color: white;">DOCTORS</a>
                            
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'dept' %}" style="color: white;">DEPARTMENT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'booking' %}" style="color: white;">BOOKING</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'contact' %}" style="color: white;">CONTACT</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        {% block content %}
        {% endblock %}
    </body>
</html>
